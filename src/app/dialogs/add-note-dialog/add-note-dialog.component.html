<ng-container [formGroup]="form">
  <app-stepper-dialog
    [visible]="isVisible"
    [header]="'DIALOGS.ADD_NOTE.ADD_NEW_NOTE'"
    [modal]="true"
    [(activeStep)]="activeStep"
    [linear]="true"
    [steps]="stepConfigs"
    [styleClass]="'add-note-dialog'"
    (close)="closeDialog()">
    <ng-template appStepPanel [stepValue]="1" [stepActions]="stepActionsMap[1]">
      <app-subheader>{{
        'DIALOGS.ADD_NOTE.DATE_SUBHEADER' | translate
      }}</app-subheader>
      <p-datepicker
        formControlName="date"
        class="max-w-full"
        [inline]="true"
        [showWeek]="true"
        fluid />
    </ng-template>
    <ng-template appStepPanel [stepValue]="2" [stepActions]="stepActionsMap[2]">
      <app-subheader>{{
        'DIALOGS.ADD_NOTE.CONTENT_SUBHEADER' | translate
      }}</app-subheader>
      <p-floatlabel variant="in">
        <textarea
          pTextarea
          id="content"
          formControlName="content"
          class="textarea"
          rows="5"
          cols="30"
          style="resize: none; width: 100%"
          class="h-full max-w-full"
          [ngClass]="{
            'invalid-input':
              form.get('content')?.invalid && form.get('content')?.touched,
          }"></textarea>
        <label for="content">{{
          'DIALOGS.ADD_NOTE.CONTENT' | translate
        }}</label>
      </p-floatlabel>
    </ng-template>
    <ng-template appStepPanel [stepValue]="3" [stepActions]="stepActionsMap[3]">
      <app-subheader>{{
        'DIALOGS.ADD_NOTE.REMINDERS_SUBHEADER' | translate
      }}</app-subheader>
      <div class="radio-buttons">
        <div>
          <p-radiobutton
            formControlName="reminderMode"
            inputId="sameDay"
            name="category"
            [value]="reminderMode.SameDay" />
          <label [for]="'sameDay'" class="ml-2">{{
            'DIALOGS.ADD_NOTE.NOTIFY_SAME_DAY' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="reminderMode"
            inputId="dayBefore"
            name="category"
            [value]="reminderMode.DayBefore" />
          <label [for]="'dayBefore'" class="ml-2">{{
            'DIALOGS.ADD_NOTE.NOTIFY_DAY_BEFORE' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="reminderMode"
            inputId="customDaysBefore"
            name="category"
            [value]="reminderMode.MultipleDaysBefore" />
          <label [for]="'customDaysBefore'" class="ml-2">{{
            'DIALOGS.ADD_NOTE.NOTIFY_CUSTOM_DAYS_BEFORE' | translate
          }}</label>
        </div>
        <p-inputnumber
          [disabled]="
            form.get('reminderMode')?.value !== reminderMode.MultipleDaysBefore
          "
          formControlName="reminderDaysBefore"
          inputId="notification" />
      </div>
    </ng-template>
    <ng-template appStepPanel [stepValue]="4" [stepActions]="stepActionsMap[4]">
      <span>{{ form.value | json }}</span>
    </ng-template>
  </app-stepper-dialog>
</ng-container>
