<p-stepper [(value)]="activeStep" [linear]="linear" class="basis-[50rem]">
  <p-step-list>
    @for (step of steps; track step.value) {
      <p-step [value]="step.value">{{ step.label | translate }}</p-step>
    }
  </p-step-list>
  <p-step-panels>
    @for (panel of stepPanels; track panel.stepValue) {
      <p-step-panel [value]="panel.stepValue">
        <ng-template #content>
          <app-step-panel [actions]="panel.stepActions">
            <ng-container [ngTemplateOutlet]="panel.template"></ng-container>
          </app-step-panel>
        </ng-template>
      </p-step-panel>
    }
  </p-step-panels>
</p-stepper>
