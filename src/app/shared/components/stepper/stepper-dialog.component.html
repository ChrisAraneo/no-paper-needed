<p-dialog
  [header]="header | translate"
  [modal]="modal"
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [styleClass]="styleClass">
  <p-stepper [value]="activeStep" (valueChange)="onActiveStepChange($event)" [linear]="linear" class="basis-[50rem]">
    <p-step-list>
      @for (step of steps; track step.value) {
        <p-step [value]="step.value">{{ step.label | translate }}</p-step>
      }
    </p-step-list>
    <p-step-panels>
      <ng-content></ng-content>
    </p-step-panels>
  </p-stepper>
</p-dialog>
