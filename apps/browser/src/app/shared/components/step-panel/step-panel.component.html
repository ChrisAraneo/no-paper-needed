<div class="step">
  <div class="content">
    <ng-content />
  </div>
  <div class="actions">
    @for (action of actions; track $index) {
      <app-button
        [label]="action.label"
        [icon]="action.icon || ''"
        [iconPosition]="action.iconPos || 'right'"
        [isDisabled]="action.disabled || false"
        [severity]="action.severity"
        (clicked)="action.onClick()" />
    }
  </div>
</div>
