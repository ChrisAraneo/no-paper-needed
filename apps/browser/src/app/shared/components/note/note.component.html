<div class="container">
  <p-card>
    @if (note?.date) {
      <p class="date">{{ note!.date | date }}</p>
    }
    @if (note?.content) {
      <div class="content">
        <p>
          {{ note!.content }}
        </p>
      </div>
    }
    @if (showEditButton) {
      <div class="edit-button">
        <app-button
          icon="pi pi-pencil"
          [isRounded]="true"
          severity="secondary"
          (clicked)="edit.emit(note)" />
      </div>
    }
  </p-card>
</div>
