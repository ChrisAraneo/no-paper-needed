<ng-container [formGroup]="form">
  <app-stepper-dialog
    styleClass="edit-note-dialog"
    [title]="'DIALOGS.EDIT_NOTE.EDIT_NOTE' | translate"
    [steps]="stepConfigs()"
    [isVisible]="isVisible()"
    [activeStep]="activeStep()"
    (activeStepChange)="activeStep.set($event)"
    (close)="closeDialog()">
    <ng-template appStepPanel [stepValue]="1" [stepActions]="step1Actions()">
      <npn-header size="md" element="h2">{{
        'DIALOGS.EDIT_NOTE.DATE_SUBHEADER' | translate
      }}</npn-header>
      <p-datepicker
        formControlName="date"
        class="max-w-full"
        fluid
        [inline]="true"
        [showWeek]="true" />
    </ng-template>
    <ng-template appStepPanel [stepValue]="2" [stepActions]="step2Actions()">
      <npn-header size="md" element="h2">{{
        'DIALOGS.EDIT_NOTE.CONTENT_SUBHEADER' | translate
      }}</npn-header>
      <p-floatlabel variant="in">
        <textarea
          pTextarea
          id="content"
          formControlName="content"
          class="textarea h-full max-w-full"
          rows="5"
          cols="30"
          [class.invalid-input]="
            contentControl.invalid && contentControl.touched
          "></textarea>
        <label for="content">{{
          'DIALOGS.EDIT_NOTE.CONTENT' | translate
        }}</label>
      </p-floatlabel>
    </ng-template>
    <ng-template appStepPanel [stepValue]="3" [stepActions]="step3Actions()">
      <npn-header size="md" element="h2">{{
        'DIALOGS.EDIT_NOTE.REMINDERS_SUBHEADER' | translate
      }}</npn-header>
      <div class="radio-buttons">
        <div>
          <p-radiobutton
            formControlName="reminderMode"
            inputId="sameDay"
            name="category"
            [value]="reminderMode.SameDay" />
          <label for="sameDay" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.NOTIFY_SAME_DAY' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="reminderMode"
            inputId="dayBefore"
            name="category"
            [value]="reminderMode.DayBefore" />
          <label for="dayBefore" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.NOTIFY_DAY_BEFORE' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="reminderMode"
            inputId="customDaysBefore"
            name="category"
            [value]="reminderMode.MultipleDaysBefore" />
          <label for="customDaysBefore" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.NOTIFY_CUSTOM_DAYS_BEFORE' | translate
          }}</label>
        </div>
        <div
          class="single-input"
          [class.disabled]="
            reminderModeControl.value !== reminderMode.MultipleDaysBefore
          ">
          <p-floatlabel variant="in">
            <p-inputnumber
              formControlName="reminderDaysBefore"
              inputId="notification"
              [disabled]="
                reminderModeControl.value !== reminderMode.MultipleDaysBefore
              " />
            <label for="notification">{{
              'DIALOGS.EDIT_NOTE.REMINDER_DAYS' | translate
            }}</label>
          </p-floatlabel>
        </div>
      </div>
    </ng-template>
    <ng-template appStepPanel [stepValue]="4" [stepActions]="step4Actions()">
      <npn-header size="md" element="h2">{{
        'DIALOGS.EDIT_NOTE.RECURRENCE_SUBHEADER' | translate
      }}</npn-header>
      <div class="radio-buttons">
        <div>
          <p-radiobutton
            formControlName="recurrenceMode"
            inputId="recurrenceNone"
            name="recurrenceMode"
            [value]="recurrenceMode.None" />
          <label for="recurrenceNone" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.RECURRENCE_NONE' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="recurrenceMode"
            inputId="recurrenceEveryYear"
            name="recurrenceMode"
            [value]="recurrenceMode.EveryYear" />
          <label for="recurrenceEveryYear" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.RECURRENCE_EVERY_YEAR' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="recurrenceMode"
            inputId="recurrenceEveryMonth"
            name="recurrenceMode"
            [value]="recurrenceMode.EveryMonth" />
          <label for="recurrenceEveryMonth" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.RECURRENCE_EVERY_MONTH' | translate
          }}</label>
        </div>
        <div>
          <p-radiobutton
            formControlName="recurrenceMode"
            inputId="recurrenceEveryFewDays"
            name="recurrenceMode"
            [value]="recurrenceMode.EveryFewDays" />
          <label for="recurrenceEveryFewDays" class="ml-2">{{
            'DIALOGS.EDIT_NOTE.RECURRENCE_EVERY_FEW_DAYS' | translate
          }}</label>
        </div>
        <div
          class="single-input"
          [class.disabled]="
            recurrenceModeControl.value !== recurrenceMode.EveryFewDays
          ">
          <p-floatlabel variant="in">
            <p-inputnumber
              formControlName="recurrenceDays"
              inputId="recurrenceDaysInput"
              [disabled]="
                recurrenceModeControl.value !== recurrenceMode.EveryFewDays
              " />
            <label for="recurrenceDaysInput">{{
              'DIALOGS.EDIT_NOTE.RECURRENCE_DAYS' | translate
            }}</label>
          </p-floatlabel>
        </div>
      </div>
    </ng-template>
    <ng-template appStepPanel [stepValue]="5" [stepActions]="step5Actions()">
      <npn-header size="md" element="h2">{{
        'DIALOGS.EDIT_NOTE.SUMMARY_SUBHEADER' | translate
      }}</npn-header>
      <div class="summary-surface">
        <app-note [note]="note()" />
      </div>
    </ng-template>
  </app-stepper-dialog>
</ng-container>
