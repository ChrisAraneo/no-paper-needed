<div class="container">
  <npn-header size="xl">{{ 'PAGES.ARCHIVE.TITLE' | translate }}</npn-header>
  <div class="notes">
    @for (row of (outdatedNotes | async) || []; track $index) {
      <div class="row">
        @for (note of row; track $index) {
          <app-note [note]="note" [showEditButton]="true" />
        }
      </div>
    } @empty {
      <span>{{ 'PAGES.ARCHIVE.NO_NOTES' | translate }}</span>
    }
  </div>
</div>
