<app-toolbar (addNote)="openAddNoteDialog()" />
<div class="main">
  <div class="page">
    <router-outlet />
  </div>
  <app-add-note-dialog
    [isVisible]="isAddNoteDialogVisible"
    (close)="closeAddNoteDialog()"
    (save)="onSaveNote($event)" />
  <app-edit-note-dialog
    [isVisible]="isEditNoteDialogVisible"
    (close)="closeEditNoteDialog()"
    (save)="onSaveNote($event)" />
</div>
