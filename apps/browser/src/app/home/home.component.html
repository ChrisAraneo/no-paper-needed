<div class="container">
  <app-today />
  <div class="notes">
    @for (row of (todayNotes | async) || []; track $index) {
      <div class="row">
        @for (note of row; track $index) {
          <app-note
            [note]="note"
            [showEditButton]="true"
            (edit)="editNote($event)" />
        }
      </div>
    } @empty {
      <span>{{ 'PAGES.HOME.NO_NOTES' | translate }}</span>
    }
  </div>
</div>
